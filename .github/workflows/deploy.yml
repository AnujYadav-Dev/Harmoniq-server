# Test, build the arm64 image, push it to GHCR and deploy it to the OCI host (docs/deployment.md).
# Secrets: OCI_HOST, OCI_DEPLOY_KEY (restricted key for the `harmoniq` user), OCI_KNOWN_HOSTS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/anujyadav-dev/harmoniq-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.lock "yt-dlp[default]" pytest pytaglib
      - run: pytest -q
        env:
          TOOLS_DIR: ""

  build:
    needs: test
    runs-on: ubuntu-24.04-arm   # native arm64, same as the OCI Ampere host
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH (health-gated, rolls back on failure)
        env:
          SSH_KEY: ${{ secrets.OCI_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
          HOST: ${{ secrets.OCI_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command only runs /opt/harmoniq/deploy.sh; the token is read from stdin to pull once.
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "harmoniq@$HOST" deploy "$GITHUB_SHA"
      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 5 https://harmoniq-server.curio.dpdns.org/healthz
